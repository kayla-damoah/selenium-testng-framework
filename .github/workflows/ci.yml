name: selenium-tests
on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests (headless Chrome)
        run: mvn -B test
      - name: Add environment info to the report
        if: always()
        run: |
          mkdir -p target/allure-results
          {
            echo "Browser=$(google-chrome --version)"
            echo "Mode=headless"
            echo "Java=$(java -version 2>&1 | head -1)"
            echo "OS=$(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "Target=https://www.saucedemo.com"
            echo "Run=${{ github.run_number }}"
            echo "Commit=${GITHUB_SHA::7}"
          } > target/allure-results/environment.properties
      - name: Build Allure report
        if: always()
        run: mvn -B allure:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/allure-results/
            screenshots/
      - uses: actions/upload-pages-artifact@v3
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: target/site/allure-maven-plugin

  # Publishes the report at https://<user>.github.io/<repo>/. Needs Settings > Pages > Source: GitHub Actions.
  # continue-on-error keeps a Pages problem from turning the whole run red.
  publish-report:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
